  formatting_only_diffs: "9 files (client.ts, client.server.ts, DeclaracaoAluno.tsx, HistoricoEditavel.tsx, 5× admin.relatorios_*.tsx) re-scanned line-by-line by the gate — no identifier, operator, or literal value differs, only whitespace/quotes/trailing commas"
