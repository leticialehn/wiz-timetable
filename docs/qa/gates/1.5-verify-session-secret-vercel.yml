issues:
  - id: QA-1.5-01
    severity: high
    category: security
    description: >
      @devops inspected the local `.env.local` by shape only (value never printed or
      committed): 52 characters but just 17 distinct, all lowercase letters plus
      separators — no digits, no uppercase, not base64, not hex. That is the
      fingerprint of a human passphrase, not 32 bytes of randomness. If the Vercel
      value was seeded from the same source, the production session cookie is
      encrypted with a low-entropy password. Since auth is hand-rolled and this single
      value is what makes escola-auth unforgeable, a guessable secret lets an attacker
      mint a cookie for any usuarioId and walk past every guard delivered by Stories
      1.1, 1.2 and 1.3 — i.e. it would silently undo the entire epic. This severity is
      attached to the production environment's current state, not to this commit; the
      story's merit is that it found and documented the risk.
    location: "Vercel Production + Preview env vars (and local .env.local)"
    recommendation: >
      Human action, highest priority open item in EPIC-001: run the pull-and-measure
      command in the story's Completion Notes against Production. Expect to rotate.
      Rotate Production AND Preview together with `openssl rand -base64 32`, and
      announce first — every logged-in secretaria/professor/coordenador is forced to
      re-login on their next request. No code change or redeploy is needed; the value
      is read from process.env at runtime. Rotate the local value too, since it is
      the likely common ancestor.

  - id: QA-1.5-02
    severity: medium
    category: requirements
    description: >
      Epic AC8 reads "SESSION_SECRET is confirmed set and strong in Vercel; documented
      in docs/framework/tech-stack.md". The story going to Done satisfies only the
      second clause. The first clause — the security-bearing one — remains open.
      Marking 1.5 Done must not be read as satisfying epic AC8.
    location: "docs/stories/epics/EPIC-001-auth-wiring.md AC8"
    recommendation: >
      Keep EPIC-001 open on AC8 until a human records the Vercel result. Track it as
      an explicit epic-level open item (now reflected in docs/estado.md), not inside
      a Done story where it will stop being read.

  - id: QA-1.5-03
    severity: low
    category: security
    description: >
      `.env.example` uses `SESSION_SECRET=""` while the story's AC3 text specified
      `SESSION_SECRET=`. The quoted-empty form matches the surrounding SUPABASE_*
      entries in the same file, so it is the more consistent choice. Recorded as a
      deliberate, harmless deviation rather than an undocumented one.
    location: ".env.example"
    recommendation: "Accept as-is; consistency with the file's existing style wins."

  - id: QA-1.5-04
    severity: low
    category: docs
    description: >
      Preview is documented as "Required: Yes". Worth confirming with the owner that
      Preview genuinely should hold a secret rather than deliberately having none —
      Story 1.1's fail-closed behaviour means an absent Preview secret degrades to an
      unusable login screen rather than an insecure one, which is arguably the safer
      default for PR previews if they point at the production database. The current
      doc is defensible; the tradeoff just was not stated.
    location: "docs/framework/tech-stack.md § Secrets, 'Where it must be set' table"
    recommendation: >
      If Preview shares the production Supabase project (it appears to — there is only
      one project per QA-1.3-03), consider whether Preview should use a *different*
      SESSION_SECRET from Production, so a leaked preview secret cannot forge
      production sessions. One sentence in the same table would settle it.

