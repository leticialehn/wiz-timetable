decision:
  verdict: CONCERNS
  rationale: >
    Design and code are correct and thoroughly verified by inspection (stronger
    verification than a normal code review, since no test suite exists). Nothing here
    warrants sending the story back to @dev. The real gap — an actual runtime
    walkthrough — is a project-level blocker that both this story and 1.1 share, and
    needs the project owner's input on how to get a safe non-prod session to test with.
  next_status: "InReview → Done"
  follow_ups:
    - "QA-1.2-01: memoize usuarioDaSessao per-request if latency becomes noticeable"
    - "QA-1.2-02: get a non-prod DB or explicit approval for a throwaway prod user, then run ONE walkthrough covering 1.1+1.2(+1.3)"
    - "QA-1.2-03: resolved by Story 1.3"
