summary: >
  Verified by direct code inspection (not by trusting the dev's claim): all 8
  *.functions.ts DB-client helpers (admin/sb/publicClient, incl. both of
  grade.functions.ts's) call requireAuthenticated() — or requireRole(["secretaria"])
  for usuarios — before returning the Supabase client. Confirmed no handler bypasses
  the helper to reach client.server directly (grep found zero bypass paths), and the
  re-counted endpoint total is exactly 39/39, matching the checklist. auth.functions.ts
  is correctly untouched apart from a comment. Design choice to guard at the helper
  rather than per-handler is sound and stronger than the literal AC1 wording. CONCERNS
  — not FAIL — because of one new performance finding and the still-open runtime
  walkthrough (now spanning two stories).

