issues:
  - id: QA-1.2-01
    severity: medium
    category: performance
    description: >
      requireAuthenticated() -> usuarioDaSessao() runs 2 Supabase queries (usuarios +
      usuario_papeis) with no caching. Every one of the 39 guarded endpoints now pays
      this cost on every call, and a single page (e.g. /professora) fires several of
      these endpoints per render — each doing its own independent session lookup, on
      top of the one already done in __root's beforeLoad (Story 1.1). This is
      redundant work, not a correctness bug.
    location: "src/lib/auth.server.ts usuarioDaSessao(); every *.functions.ts helper"
    recommendation: >
      Not blocking at current scale (~5 users). If it becomes noticeable, memoize
      usuarioDaSessao per-request (e.g. an AsyncLocalStorage-backed cache keyed by the
      request, cleared per request) so N calls in one page load cost one DB round
      trip instead of N.

  - id: QA-1.2-02
    severity: medium
    category: requirements
    description: >
      Same class as QA-1.1-02, now compounding: the logged-in walkthrough (AC5) and
      the logged-out-RPC-rejected proof (AC3) have not been exercised at runtime for
      EITHER story 1.1 or 1.2. Attempts this session to test via raw curl against the
      dev server's server-fn endpoint failed with "Invalid server function ID" (dev
      hashes differ from build hashes) — not a security signal, just an unusable test
      method. Code-level verification (this gate) is strong, but no live proof exists
      yet that a real logged-in secretaria/professor session can still use the app.
    location: "whole app — needs an actual authenticated session to test"
    recommendation: >
      Needs a decision from the project owner (see message to user): either point a
      non-prod Supabase project/branch at this app temporarily, or explicitly approve
      creating + deleting one throwaway user in the connected (production) database.
      One walkthrough now covers 1.1 + 1.2 + will cover 1.3.
    resolution: >
      RESOLVED 2026-09-14. The earlier "Invalid server function ID" failure was a
      stale-hash problem, not a fundamental blocker: server-fn ids are re-generated
      per dev-server boot, so they must be scraped fresh from the running server's
      transformed module (`GET /src/lib/<file>.ts`), not hardcoded. With fresh ids and
      the existing `teste` test user, both AC3 and AC5 are now runtime-verified: a
      protected mutation (`criarProfessora`) called with no session cookie returns
      `"Não autorizado. Faça login."` before any DB access (AC3, logged-out RPC
      rejected); logging in as `teste` and calling `getSessaoAtual` returns
      `autenticado:true` with the correct session-derived `papeis` (AC5, logged-in
      session works). Full sequence and evidence in `docs/estado.md` 2026-09-14.

  - id: QA-1.2-03
    severity: low
    category: code
    description: >
      /admin/usuarios is reachable by any logged-in user today (no role-based nav
      hiding yet — that's Story 1.3 AC5). A professor visiting it sees the page shell
      render, then listarUsuarios (GET) fails with "Não autorizado..." because it now
      requires the secretaria role too. Not a security hole (the guard does its job),
      just a rough error state instead of the page being hidden.
    location: "src/routes/admin.usuarios.tsx"
    recommendation: "Resolved once Story 1.3 hides admin-only nav for non-secretaria users."

  - id: QA-1.2-04
    severity: low
    category: tests
    description: "No automated tests. Project-wide gap, tracked as EPIC-003."
    location: "repo"
    recommendation: "Same as QA-1.1-07 — cover the guard rejection path when vitest lands."

