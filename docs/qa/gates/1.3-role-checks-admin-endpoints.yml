storyId: "1.3"
storyTitle: "Role checks on admin-only endpoints"
epic: "EPIC-001"
gateType: blocking
verdict: CONCERNS
reviewer: "Quinn (@qa)"
reviewed_revision: "commit:bf5a899"
reviewed_at: "2026-09-11"

summary: >
  Verified by direct code inspection (diff read in full, not the dev's self-report):
  all 14 newly-gated endpoints across cadastros/calendario/grade.functions.ts call
  requireRole(["secretaria"]) as the literal first statement of the handler, before
  any Supabase client call — matches the pattern already proven in
  usuarios.functions.ts (Story 1.2 AC7). alertas.functions.ts's professora-scoping
  (AC3) reads usuario.professora_id only from the session (usuarioDaSessao()), never
  from request input — getAlertasAtivos takes no input at all, so there is no
  professora_id spoofing surface. Fails closed when professora_id is null. CONCERNS
  — not FAIL — for the same class of gap as 1.1 and 1.2: the runtime walkthrough
  (AC4) was attempted this session but blocked by a Chrome automation tool failure
  unrelated to the app (confirmed independently: localhost, LAN IP, and even
  google.com/example.com all failed to render after a Chrome restart), plus two new
  findings below (performance, and a narrower AC5 scope than QA-1.2-03 predicted).

