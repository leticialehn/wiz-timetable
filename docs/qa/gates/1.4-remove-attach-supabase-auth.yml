  rationale: >
    The diff is correct, minimal, well-reasoned and independently re-verified end to
    end by this gate. It is the cleanest change in EPIC-001 so far. CONCERNS rather
    than PASS is a statement about the project's inherited gaps — no test harness, a
    broken repo-wide lint, and a never-completed runtime walkthrough — not about this
    story's work, which has no defects. PASS would misrepresent the evidence base
    (`unit_tests` cannot be "OK" where no test runner exists); FAIL would be absurd
    for a two-line deletion that removes provably unreachable code.
