positive_findings:
  performance: >
    Net improvement, not merely neutral: attachSupabaseAuth ran
    `await supabase.auth.getSession()` on the client before *every* server-function
    RPC. That is an await on the Supabase Auth SDK (storage read, and potentially a
    token-refresh attempt) on every mutation and query in the app, to produce an
    empty header bag. Removing it takes one async hop off every RPC.
  security: >
    Attack surface strictly reduced. requireSupabaseAuth accepted a caller-supplied
    `Bearer` token and built a Supabase client around it; it was unreachable, but it
    was a live-looking, generated-file-labelled auth primitive sitting in the tree
    next to the real one. Deleting it removes the risk that a future contributor
    wires up the wrong auth model by accident. It also eliminates the last
    `supabase.auth.*` call site in the codebase — the app now has exactly one auth
    story, which was the stated goal.

