  - id: QA-1.4-02
    severity: medium
    category: code
    description: >
      Epic AC9 and this story's AC6 both require `npm run lint` to pass, and it does
      not — repo-wide. Two independent pre-existing causes, neither introduced here:
      (a) `core.autocrlf=true` locally vs `* text=auto eol=lf` in `.gitattributes`,
      so prettier/prettier reports `Delete ␍` on every line of every file;
      (b) `.vercel/` is gitignored but not in eslint's `ignores`, so `eslint .` walks
      the generated Vercel bundle — this is what makes the run hang / get OOM-killed,
      an issue that has now disrupted three consecutive gates (1.3, 1.4).
      Zero non-`prettier/prettier` errors were reported anywhere, so this is formatting
      noise masking a real quality gate, not latent bugs.
    location: "eslint.config.js (ignores), .gitattributes vs local core.autocrlf"
    recommendation: >
      Raise as an explicit tech-debt story (suggest 1.6 or fold into EPIC-003's CI
      work, which needs a working `eslint .` anyway): add `.vercel` to
      eslint.config.js `ignores`, then normalise line endings once
      (`git add --renormalize .`) or set `core.autocrlf=false` for this repo.
      Until then, epic AC9 cannot be honestly claimed, and no story should be asked
      to carry this debt individually. Explicitly waived for this story's gate at the
      lead's direction — tracked separately, not a 1.4 defect.

