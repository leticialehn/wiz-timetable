static_verification_rationale: >
  AC5 was accepted without a runtime walkthrough because this change is a deletion of
  code with no reachable call path, which static analysis can fully cover:
  (a) requireSupabaseAuth had zero importers before the commit — it could never have
  run, so deleting it cannot change behaviour by construction;
  (b) attachSupabaseAuth had exactly one registration (start.ts functionMiddleware),
  removed in the same commit, so no partially-unwired state exists;
  (c) it was a `.client()` middleware whose only effect was
  `next({ headers: token ? { Authorization: ... } : {} })`, and `token` came from
  `supabase.auth.getSession()`, which is never populated because the app never calls
  `supabase.auth.signIn*` — confirmed by the gate: `supabase.auth` now has zero
  occurrences anywhere in src/;
  (d) no server-side auth path reads an Authorization header — auth.server.ts reads
  only the escola-auth cookie via useSession.
  Therefore the removed middleware always sent an empty header bag, and its removal is
  observationally identical to leaving it in place. This reasoning does not generalise
  to 1.1–1.3, whose walkthrough gap remains genuinely open.

